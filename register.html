<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUOR | Crear cuenta</title>
  <meta name="description" content="Crea tu cuenta en SUOR y organiza tus tareas, calendario y finanzas mensuales.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%97%82%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
  <main class="auth-container">
    <section class="auth-card">
      <div class="auth-info">
        <span class="brand-pill">SUOR</span>
        <h1>Crea tu espacio personal</h1>
        <p>Guarda tus tareas, secciones importantes y gastos mensuales en Supabase.</p>
      </div>

      <form id="registerForm" class="auth-form">
        <h2>Registrarse</h2>
        <p class="form-subtitle">Completa tus datos para empezar.</p>

        <label for="username">Nombre de usuario</label>
        <input type="text" id="username" placeholder="Ejemplo: Stephano" required>

        <label for="firstName">Nombre</label>
        <input type="text" id="firstName" placeholder="Tu nombre" required>

        <label for="lastName">Apellido</label>
        <input type="text" id="lastName" placeholder="Tu apellido" required>

        <label for="birthDate">Fecha de nacimiento</label>
        <input type="date" id="birthDate" required>

        <label for="email">Correo</label>
        <input type="email" id="email" placeholder="ejemplo@gmail.com" autocomplete="email" required>

        <label for="confirmEmail">Confirmar correo</label>
        <input type="email" id="confirmEmail" placeholder="Repite tu correo" autocomplete="email" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Mínimo 6 caracteres" minlength="6" autocomplete="new-password" required>

        <label for="confirmPassword">Confirmar contraseña</label>
        <input type="password" id="confirmPassword" placeholder="Repite tu contraseña" minlength="6" autocomplete="new-password" required>

        <button type="submit">Crear cuenta</button>
        <p class="mensaje" id="registerMensaje"></p>

        <p class="auth-link">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
        <p class="auth-link"><a href="index.html">← Volver al inicio</a></p>
      </form>
    </section>
  </main>

  <script>
    document.getElementById("birthDate").max = new Date().toISOString().split("T")[0];
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
